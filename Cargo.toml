[package]
name = "vartrix"
version = "1.1.23"
authors = ["Ian Fiddes <ian.t.fiddes@gmail.com>", "Patrick Marks <patrick@10xgenomics.com>"]
edition = "2018"

[dependencies]
bio = "4.2"
rust-htslib = "1.0.1"
csv = "1"
failure = "0.1.8"
sprs = "*"
clap = "4"
rayon = "1.7"
terminal_size = "*"
human-panic = "2.0.4"
simplelog = "0.12.2"
log = "*"
tempfile = "*"
itertools = "0.15"
flate2 = { version = "1.0", features = ["rust_backend"], default-features = false }

[profile.release]
debug = 1
lto = true
