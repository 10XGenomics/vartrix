[package]
name = "vartrix"
version = "2.0.0"
authors = ["10x Genomics"]
edition = "2024"

[dependencies]
anyhow = "1"
bio = "3"
clap = { version = "4", features = ["derive", "wrap_help"] }
flate2 = "1"
human-panic = "2"
log = "0.4"
rayon = "1"
rust-htslib = "1"
simplelog = "0.12"
sprs = "0.11"

# The Cell Ranger libraries are licensed separately from VarTrix. They are not
# vendored in this repository; Cargo fetches them from the public Cell Ranger
# repository at build time.
[dependencies.cr_vartrix]
git = "https://github.com/10XGenomics/cellranger"
tag = "cellranger-10.1.0"
package = "vartrix"

[dependencies.barcode]
git = "https://github.com/10XGenomics/cellranger"
tag = "cellranger-10.1.0"

[dependencies.cr_types]
git = "https://github.com/10XGenomics/cellranger"
tag = "cellranger-10.1.0"

[dependencies.metric]
git = "https://github.com/10XGenomics/cellranger"
tag = "cellranger-10.1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
lto = true
